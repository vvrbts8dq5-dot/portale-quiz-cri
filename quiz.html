<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz — Portale CRI</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --red: #CC0000;
    --red-dark: #990000;
    --green: #1a7a3c;
    --green-bg: #f0faf4;
    --green-border: #b6e8ca;
    --wrong-bg: #fff5f5;
    --wrong-border: #ffd0d0;
    --bg: #f7f5f2;
    --bg2: #ffffff;
    --text: #1a1a1a;
    --text2: #666;
    --border: #e0ddd8;
    --radius: 12px;
    --shadow: 0 2px 16px rgba(0,0,0,0.07);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 24px 16px 48px;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image: radial-gradient(circle at 20% 20%, rgba(204,0,0,0.04) 0%, transparent 50%);
    pointer-events: none;
    z-index: 0;
  }

  .wrap {
    max-width: 600px;
    margin: 0 auto;
    position: relative;
    z-index: 1;
  }

  /* Topbar */
  .topbar {
    display: none;
    align-items: center;
    gap: 12px;
    margin-bottom: 28px;
    animation: fadeUp 0.4s ease both;
  }
  .topbar.visible { display: flex; }

  .logo-sm {
    width: 36px; height: auto;
    flex-shrink: 0;
  }

  .topbar-title { font-size: 13px; font-weight: 600; color: var(--red); line-height: 1.2; }
  .topbar-sub { font-size: 11px; color: var(--text2); margin-top: 2px; }

  /* Card */
  .card {
    background: var(--bg2);
    border-radius: var(--radius);
    padding: 28px;
    box-shadow: var(--shadow);
    border: 1px solid var(--border);
    animation: fadeUp 0.4s ease both;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(14px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* Screens */
  .screen { display: none; }
  .screen.active { display: block; }

  /* ---- SCHERMATA NOME ---- */
  .reg-head { text-align: center; margin-bottom: 24px; }
  .reg-head img { width: 200px; height: auto; max-width: 80%; margin-bottom: 12px; }
  .reg-title { font-size: 20px; font-weight: 600; color: var(--red); }
  .reg-comitato { font-size: 14px; font-weight: 500; color: var(--red); margin-top: 3px; }
  .reg-sub { font-size: 13px; color: var(--text); margin-top: 4px; margin-bottom: 0; }

  .screen-label {
    font-size: 11px; font-weight: 500;
    text-transform: uppercase; letter-spacing: 0.8px;
    color: var(--text2); margin-bottom: 18px;
  }

  .form-group { margin-bottom: 16px; }
  .form-group label {
    display: block; font-size: 13px; font-weight: 500;
    color: var(--text2); margin-bottom: 6px;
  }

  .form-group input {
    width: 100%; padding: 13px 14px;
    border: 1.5px solid var(--border);
    border-radius: 8px;
    font-family: 'DM Sans', sans-serif;
    font-size: 15px; color: var(--text);
    background: var(--bg); outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
  }

  .form-group input:focus {
    border-color: var(--red);
    box-shadow: 0 0 0 3px rgba(204,0,0,0.08);
    background: white;
  }

  /* Badge corso */
  .corso-badge {
    display: inline-flex; align-items: center; gap: 6px;
    background: rgba(204,0,0,0.07);
    color: var(--red); border-radius: 20px;
    padding: 4px 12px; font-size: 12px; font-weight: 500;
    margin-bottom: 20px;
  }

  /* ---- SCELTA NUMERO DOMANDE ---- */
  .choice-grid {
    display: grid; grid-template-columns: 1fr 1fr;
    gap: 12px; margin-top: 8px;
  }

  .choice-btn {
    border: 2px solid var(--border);
    border-radius: 10px; background: var(--bg);
    padding: 20px 16px; cursor: pointer;
    text-align: center; transition: all 0.2s;
    font-family: 'DM Sans', sans-serif;
  }

  .choice-btn:hover { border-color: var(--red); background: white; }

  .choice-num {
    font-size: 32px; font-weight: 600;
    color: var(--red); line-height: 1;
    font-family: 'DM Mono', monospace;
  }

  .choice-label {
    font-size: 13px; color: var(--text2); margin-top: 4px;
  }

  /* ---- QUIZ ---- */
  .progress-wrap { margin-bottom: 20px; }

  .progress-info {
    display: flex; justify-content: space-between;
    font-size: 12px; color: var(--text2); margin-bottom: 8px;
  }

  .progress-bar {
    height: 4px; background: var(--border);
    border-radius: 99px; overflow: hidden;
  }

  .progress-fill {
    height: 100%; background: var(--red);
    border-radius: 99px;
    transition: width 0.4s ease;
  }

  /* ---- TIMER ---- */
  .timer-wrap {
    display: flex;
    justify-content: center;
    margin-bottom: 16px;
  }

  .timer-badge {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    background: var(--bg);
    border: 1.5px solid var(--border);
    border-radius: 99px;
    padding: 6px 16px;
    font-size: 15px;
    font-weight: 600;
    color: var(--text2);
    font-family: 'DM Mono', monospace;
    transition: all 0.3s;
  }

  .timer-badge.warning {
    border-color: #f59e0b;
    color: #b45309;
    background: #fffbeb;
  }

  .timer-badge.danger {
    border-color: var(--red);
    color: var(--red);
    background: #fff0f0;
    animation: pulse 1s infinite;
  }

  @keyframes pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.04); }
  }
  }

  .question-num {
    font-size: 11px; font-weight: 500;
    text-transform: uppercase; letter-spacing: 0.8px;
    color: var(--text2); margin-bottom: 10px;
  }

  .question-type-badge {
    display: inline-block;
    font-size: 10px; font-weight: 500;
    text-transform: uppercase; letter-spacing: 0.6px;
    padding: 2px 8px; border-radius: 4px;
    margin-bottom: 10px;
  }

  .badge-multi { background: #e8f0fe; color: #1a56b0; }
  .badge-vf { background: #fef3e2; color: #b45309; }

  .question-text {
    font-size: 17px; font-weight: 500;
    line-height: 1.5; margin-bottom: 22px;
    color: var(--text);
  }

  .options { display: flex; flex-direction: column; gap: 10px; }

  .option-btn {
    display: flex; align-items: center; gap: 12px;
    padding: 14px 16px;
    border: 1.5px solid var(--border);
    border-radius: 10px; background: var(--bg);
    cursor: pointer; text-align: left; width: 100%;
    font-family: 'DM Sans', sans-serif;
    font-size: 14px; color: var(--text);
    transition: all 0.15s;
    position: relative;
  }

  .option-btn:hover:not(:disabled) {
    border-color: var(--red); background: white;
  }

  .option-letter {
    width: 28px; height: 28px; flex-shrink: 0;
    border-radius: 50%; border: 1.5px solid var(--border);
    display: flex; align-items: center; justify-content: center;
    font-size: 12px; font-weight: 500; color: var(--text2);
    font-family: 'DM Mono', monospace;
    transition: all 0.15s;
  }

  .option-btn:hover:not(:disabled) .option-letter {
    border-color: var(--red); color: var(--red);
  }

  .option-btn.selected {
    border-color: var(--text);
    background: white;
    pointer-events: none;
  }

  .option-btn.selected .option-letter {
    background: var(--text); border-color: var(--text); color: white;
  }

  /* Risposta selezionata corretta */
  .option-btn.correct-sel {
    border-color: var(--green); background: var(--green-bg);
    pointer-events: none;
  }
  .option-btn.correct-sel .option-letter {
    background: var(--green); border-color: var(--green); color: white;
  }

  /* Risposta selezionata errata */
  .option-btn.wrong-sel {
    border-color: var(--red); background: var(--wrong-bg);
    pointer-events: none;
  }
  .option-btn.wrong-sel .option-letter {
    background: var(--red); border-color: var(--red); color: white;
  }

  /* Evidenzia la risposta corretta quando si sbaglia */
  .option-btn.correct-ans {
    border-color: var(--green); background: var(--green-bg);
    pointer-events: none;
  }
  .option-btn.correct-ans .option-letter {
    background: var(--green); border-color: var(--green); color: white;
  }

  .option-btn.correct {
    border-color: var(--green); background: var(--green-bg);
    pointer-events: none;
  }

  .option-btn.correct .option-letter {
    background: var(--green); border-color: var(--green); color: white;
  }

  .option-btn.wrong {
    border-color: var(--red); background: var(--wrong-bg);
    pointer-events: none;
  }

  .option-btn.wrong .option-letter {
    background: var(--red); border-color: var(--red); color: white;
  }

  .option-btn.show-correct {
    border-color: var(--green); background: var(--green-bg);
    pointer-events: none;
  }

  .option-btn.show-correct .option-letter {
    background: var(--green); border-color: var(--green); color: white;
  }

  .option-btn:disabled { pointer-events: none; }

  .feedback-msg {
    margin-top: 16px; padding: 12px 14px;
    border-radius: 8px; font-size: 13px;
    display: none;
  }

  .feedback-msg.correct-fb {
    background: var(--green-bg); border: 1px solid var(--green-border);
    color: var(--green); display: block;
  }

  .feedback-msg.wrong-fb {
    background: var(--wrong-bg); border: 1px solid var(--wrong-border);
    color: var(--red); display: block;
  }

  .btn-next {
    width: 100%; margin-top: 16px; padding: 14px;
    background: var(--red); color: white; border: none;
    border-radius: 8px; font-family: 'DM Sans', sans-serif;
    font-size: 15px; font-weight: 500; cursor: pointer;
    transition: background 0.2s; display: none;
  }

  .btn-next:hover { background: var(--red-dark); }
  .btn-next.visible { display: block; animation: fadeUp 0.3s ease both; }

  /* ---- RISULTATI ---- */
  .result-header { text-align: center; padding: 8px 0 24px; }

  .result-icon {
    font-size: 48px; margin-bottom: 12px;
    animation: pop 0.4s cubic-bezier(0.34,1.56,0.64,1) both;
  }

  @keyframes pop {
    from { transform: scale(0.5); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
  }

  .result-title {
    font-size: 22px; font-weight: 600; margin-bottom: 4px;
  }

  .result-sub { font-size: 14px; color: var(--text2); }

  .score-box {
    display: flex; align-items: center; justify-content: center;
    gap: 24px; margin: 24px 0;
    padding: 20px; background: var(--bg);
    border-radius: 10px; border: 1px solid var(--border);
  }

  .score-item { text-align: center; }

  .score-num {
    font-size: 28px; font-weight: 600;
    font-family: 'DM Mono', monospace;
    line-height: 1;
  }

  .score-num.green { color: var(--green); }
  .score-num.red { color: var(--red); }
  .score-num.main { font-size: 36px; color: var(--text); }

  .score-label { font-size: 11px; color: var(--text2); margin-top: 4px; text-transform: uppercase; letter-spacing: 0.5px; }

  .score-divider { width: 1px; height: 40px; background: var(--border); }

  /* Riepilogo errori */
  .review-title {
    font-size: 13px; font-weight: 500; color: var(--text2);
    text-transform: uppercase; letter-spacing: 0.8px;
    margin: 24px 0 14px;
  }

  .review-item {
    border: 1px solid var(--border); border-radius: 10px;
    overflow: hidden; margin-bottom: 10px;
  }

  .review-question {
    padding: 12px 14px; font-size: 14px; font-weight: 500;
    background: var(--bg); border-bottom: 1px solid var(--border);
    line-height: 1.4;
  }

  .review-answers { padding: 10px 14px; display: flex; flex-direction: column; gap: 6px; }

  .review-answer {
    font-size: 13px; padding: 6px 10px; border-radius: 6px;
    display: flex; align-items: center; gap: 8px;
  }

  .review-answer.your-wrong {
    background: var(--wrong-bg); color: var(--red);
  }

  .review-answer.correct-ans {
    background: var(--green-bg); color: var(--green);
  }

  .review-dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
  .dot-red { background: var(--red); }
  .dot-green { background: var(--green); }

  /* Bottoni risultati */
  .result-actions { display: flex; flex-direction: column; gap: 10px; margin-top: 24px; }

  .btn-primary {
    width: 100%; padding: 14px;
    background: var(--red); color: white; border: none;
    border-radius: 8px; font-family: 'DM Sans', sans-serif;
    font-size: 15px; font-weight: 500; cursor: pointer;
    transition: background 0.2s;
  }
  .btn-primary:hover { background: #a00; }

  .btn-retry {
    width: 100%; padding: 14px; background: var(--red); color: white;
    border: none; border-radius: 8px; font-family: 'DM Sans', sans-serif;
    font-size: 15px; font-weight: 500; cursor: pointer; transition: background 0.2s;
  }

  .btn-retry:hover { background: var(--red-dark); }

  .btn-storico {
    width: 100%; padding: 14px; background: var(--bg); color: var(--text);
    border: 1.5px solid var(--border); border-radius: 8px;
    font-family: 'DM Sans', sans-serif; font-size: 15px; cursor: pointer;
    transition: border-color 0.2s;
  }
  .btn-storico:hover { border-color: var(--red); color: var(--red); }

  .btn-home {
    width: 100%; padding: 14px; background: var(--bg); color: var(--text2);
    border: 1.5px solid var(--border); border-radius: 8px;
    font-family: 'DM Sans', sans-serif; font-size: 15px; cursor: pointer;
    transition: border-color 0.2s;
  }

  .btn-home:hover { border-color: var(--text2); }

  /* Storico card */
  .storico-item {
    border: 1.5px solid var(--border); border-radius: 10px;
    padding: 14px 16px; margin-bottom: 10px; background: var(--bg);
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
  }
  .storico-left { flex: 1; }
  .storico-corso { font-size: 13px; font-weight: 600; color: var(--text); }
  .storico-data { font-size: 12px; color: var(--text2); margin-top: 2px; }
  .storico-right { text-align: right; flex-shrink: 0; }
  .storico-pct { font-size: 18px; font-weight: 700; }
  .storico-pct.pass { color: var(--green); }
  .storico-pct.fail { color: var(--red); }
  .storico-domande { font-size: 11px; color: var(--text2); margin-top: 2px; }

  /* Esito badge */
  .esito-badge {
    display: inline-block; padding: 6px 16px; border-radius: 20px;
    font-size: 13px; font-weight: 500; margin-top: 8px;
  }

  .esito-pass { background: var(--green-bg); color: var(--green); border: 1px solid var(--green-border); }
  .esito-fail { background: var(--wrong-bg); color: var(--red); border: 1px solid var(--wrong-border); }

  /* Saving overlay */
  .saving-msg {
    text-align: center; padding: 12px; font-size: 13px;
    color: var(--text2); display: none;
  }
</style>
</head>
<body>
<div class="wrap">

  <!-- TOPBAR -->
  <div class="topbar">
    <img src="logo-cri.png" alt="CRI" class="logo-sm" />
    <div>
      <div class="topbar-title">Croce Rossa Italiana</div>
      <div class="topbar-sub" id="topbarSub">Comitato di Padova</div>
    </div>
  </div>

  <!-- SCHERMATA 1: NOME E COGNOME -->
  <div class="card screen active" id="screenNome" style="display:none">
    <!-- Schermata nome spostata su index.html -->
  </div>

  <!-- SCHERMATA 2: SCELTA NUMERO DOMANDE -->
  <div class="card screen" id="screenScelta">
    <div class="screen-label">Configura il test</div>
    <p style="font-size:15px;font-weight:500;margin-bottom:6px">Quante domande vuoi fare?</p>
    <p style="font-size:13px;color:var(--text2);margin-bottom:20px">Le domande saranno selezionate casualmente dal database.</p>
    <div class="choice-grid">
      <button class="choice-btn" onclick="startQuiz(15)">
        <div class="choice-num">15</div>
        <div class="choice-label">domande</div>
      </button>
      <button class="choice-btn" onclick="startQuiz(30)">
        <div class="choice-num">30</div>
        <div class="choice-label">domande</div>
      </button>
    </div>
  </div>

  <!-- SCHERMATA 3: QUIZ -->
  <div class="card screen" id="screenQuiz">
    <div class="timer-wrap">
      <div class="timer-badge" id="timerBadge">⏱ <span id="timerDisplay">15:00</span></div>
    </div>
    <div class="progress-wrap">
      <div class="progress-info">
        <span id="progressText">Domanda 1 di 15</span>
        <span id="progressPct">0%</span>
      </div>
      <div class="progress-bar">
        <div class="progress-fill" id="progressFill" style="width:0%"></div>
      </div>
    </div>

    <div class="question-num" id="questionNum">Domanda 1</div>
    <div id="questionTypeBadge"></div>
    <div class="question-text" id="questionText"></div>
    <div class="options" id="optionsWrap"></div>
    <div class="feedback-msg" id="feedbackMsg"></div>
    <button class="btn-next" id="btnNext" onclick="nextQuestion()">Prossima domanda →</button>
  </div>

  <!-- SCHERMATA 4: RISULTATI -->
  <div class="card screen" id="screenRisultati">
    <div class="result-header">
      <div class="result-icon" id="resultIcon">🎯</div>
      <div class="result-title" id="resultTitle">Ottimo lavoro!</div>
      <div class="result-sub" id="resultSub"></div>
      <div id="resultEsito"></div>
    </div>

    <div class="score-box">
      <div class="score-item">
        <div class="score-num green" id="scoreCorrette">0</div>
        <div class="score-label">Corrette</div>
      </div>
      <div class="score-divider"></div>
      <div class="score-item">
        <div class="score-num main" id="scoreTotale">0</div>
        <div class="score-label">Totale</div>
      </div>
      <div class="score-divider"></div>
      <div class="score-item">
        <div class="score-num red" id="scoreErrate">0</div>
        <div class="score-label">Errate</div>
      </div>
    </div>

    <div id="reviewSection">
      <div class="review-title" id="reviewTitle"></div>
      <div id="reviewList"></div>
    </div>

    <div class="saving-msg" id="savingMsg">💾 Salvataggio risultato...</div>

    <div class="result-actions">
      <button class="btn-retry" onclick="retryQuiz()">🔄 Rifai il test</button>
      <button class="btn-storico" onclick="mostraStorico()">📊 I miei quiz</button>
      <button class="btn-home" onclick="goHome()" style="color:var(--text2)">🏠 Torna alla home</button>
    </div>
  </div>

  <!-- SCHERMATA STORICO PERSONALE -->
  <div class="card screen" id="screenStorico">
    <div style="margin-bottom:20px">
      <button class="back-btn" onclick="backToResults()" style="background:none;border:none;color:var(--text2);font-size:13px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;padding:0;font-family:'DM Sans',sans-serif;transition:color 0.2s">← Torna ai risultati</button>
    </div>
    <div style="font-size:18px;font-weight:600;margin-bottom:6px">📊 I miei quiz</div>
    <div style="font-size:13px;color:var(--text2);margin-bottom:20px" id="storicoSub"></div>
    <div id="storicoList"></div>
    <div style="display:flex;flex-direction:column;gap:10px;margin-top:24px">
      <button class="btn-home" onclick="backToHome()" style="width:100%;padding:14px;background:var(--bg);color:var(--text2);border:1.5px solid var(--border);border-radius:8px;font-family:'DM Sans',sans-serif;font-size:15px;cursor:pointer;transition:border-color 0.2s">🏠 Torna alla home</button>
    </div>
  </div>

</div>

<!-- Firebase -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, collection, addDoc, getDocs, query, where, orderBy, limit, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyAQsAwG237CMsuqlNTvrGyfNphDSjlg4JM",
  authDomain: "portale-quiz-cri.firebaseapp.com",
  projectId: "portale-quiz-cri",
  storageBucket: "portale-quiz-cri.firebasestorage.app",
  messagingSenderId: "889294477843",
  appId: "1:889294477843:web:69a0e52a858a482becbde6"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

// Stato globale
let stato = {
  nome: '', cognome: '',
  corso: '', corsoLabel: '',
  categoria: '', categoriaLabel: '',
  domande: [], domandeSelezionate: [],
  current: 0, corrette: 0,
  risposteDate: [], // {domanda, tuaRisposta, rispostaCorretta, esito}
  numDomande: 15
};

// Leggi parametri URL
const params = new URLSearchParams(window.location.search);
stato.corso = params.get('corso') || 'base';
stato.categoria = params.get('categoria') || '';

// Labels
const corsoLabels = {
  base: 'Corso Base', tssa: 'Corso TSSA', squadra: 'Formazione Squadra'
};
const categoriaLabels = {
  tssa_adulto: 'Protocolli adulto', tssa_pediatrico: 'Protocolli pediatrico',
  tssa_resp: 'Problematica respiratoria', tssa_neuro: 'Problematica neurologica',
  tssa_cardio: 'Problematica cardiaca', tssa_farmaci: 'Farmaci',
  tssa_ossigeno: 'Ossigeno', tssa_trauma: 'Trauma', tssa_anatomia: 'Anatomia e Fisiologia', tssa_generale: 'Quiz Generale TSSA'
};

stato.corsoLabel = corsoLabels[stato.corso] || stato.corso;

// Collezione Firebase da usare
function getCollezione() {
  if (stato.corso === 'base') return 'domande_base';
  if (stato.corso === 'squadra') return 'domande_squadra';
  if (stato.categoria === 'tssa_generale') return null; // multipla
  if (stato.categoria === 'tssa_trauma') return 'trauma'; // collezione dedicata
  return 'domande_' + stato.categoria;
}

// Normalizza domande dal formato nuovo (domanda/risposte/corretta numerico)
// al formato standard del portale (testo/opzioni/corretta stringa)
function normalizzaDomanda(d) {
  if (d.domanda && d.risposte && typeof d.corretta === 'number') {
    return {
      testo: d.domanda,
      opzioni: d.risposte,
      corretta: d.risposte[d.corretta],
      tipo: 'multipla'
    };
  }
  return d; // già nel formato corretto
}

// Funzione per mescolare array
function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

// Carica domande da Firebase o usa esempi
async function caricaDomande() {
  try {
    const col = getCollezione();
    let tuttiDocumenti = [];

    if (col) {
      const snap = await getDocs(collection(db, col));
      snap.forEach(doc => tuttiDocumenti.push(normalizzaDomanda(doc.data())));
    } else if (stato.categoria === 'tssa_generale') {
      // Carica da tutte le collezioni TSSA
      const categorieTSSA = ['tssa_adulto','tssa_pediatrico','tssa_resp','tssa_neuro','tssa_cardio','tssa_farmaci','tssa_ossigeno','tssa_trauma','tssa_anatomia'];
      for (const cat of categorieTSSA) {
        const nomeCol = cat === 'tssa_trauma' ? 'trauma' : 'domande_' + cat;
        const snap = await getDocs(collection(db, nomeCol));
        snap.forEach(doc => tuttiDocumenti.push(normalizzaDomanda(doc.data())));
      }
    }

    // Se Firebase è vuoto usa le domande di esempio
    if (tuttiDocumenti.length === 0) {
      tuttiDocumenti = DOMANDE_ESEMPIO;
    }

    stato.domande = tuttiDocumenti;
  } catch (e) {
    stato.domande = DOMANDE_ESEMPIO;
  }
}

// Avvia quiz
window.startQuiz = async function(n) {
  stato.numDomande = n;
  stato.current = 0;
  stato.corrette = 0;
  stato.risposteDate = [];

  await caricaDomande();

  // PROGRESSIONE DIFFICOLTÀ: facile → medio → difficile
  const conDiff = stato.domande.filter(d => d.difficolta);
  let selezionate;

  if (conDiff.length >= Math.round(n * 0.5)) {
    // Abbastanza domande con difficoltà → usa progressione
    const facili    = shuffle(conDiff.filter(d => d.difficolta === 'facile'));
    const medi      = shuffle(conDiff.filter(d => d.difficolta === 'medio'));
    const difficili = shuffle(conDiff.filter(d => d.difficolta === 'difficile'));
    const nF = Math.round(n * 0.35);
    const nD = Math.round(n * 0.15);
    const nM = n - nF - nD;
    selezionate = [
      ...facili.slice(0, nF),
      ...medi.slice(0, nM),
      ...difficili.slice(0, nD)
    ];
    // Integra se mancano domande per qualche livello
    if (selezionate.length < n) {
      const usate = new Set(selezionate);
      const resto = shuffle(stato.domande.filter(d => !usate.has(d)));
      selezionate = [...selezionate, ...resto].slice(0, n);
    }
  } else {
    // Domande senza difficoltà → mescola casualmente
    selezionate = shuffle(stato.domande).slice(0, Math.min(n, stato.domande.length));
  }

  stato.domandeSelezionate = selezionate;

  // TIMER: 1 minuto per domanda (15 min per 15 domande, 30 min per 30)
  avviaTimer(n * 60);

  showScreen('screenQuiz');
  renderDomanda();
};

// TIMER
let timerInterval = null;

function avviaTimer(secondiTotali) {
  // Pulisce eventuale timer precedente
  if (timerInterval) clearInterval(timerInterval);

  let secondiRimasti = secondiTotali;
  const badge = document.getElementById('timerBadge');
  const display = document.getElementById('timerDisplay');

  function aggiorna() {
    const min = Math.floor(secondiRimasti / 60);
    const sec = secondiRimasti % 60;
    display.textContent = `${String(min).padStart(2,'0')}:${String(sec).padStart(2,'0')}`;

    // Colori: normale → warning (< 3 min) → danger (< 1 min)
    badge.classList.remove('warning', 'danger');
    if (secondiRimasti < 60) {
      badge.classList.add('danger');
    } else if (secondiRimasti < 180) {
      badge.classList.add('warning');
    }

    if (secondiRimasti <= 0) {
      clearInterval(timerInterval);
      display.textContent = '00:00';
      // Tempo scaduto → mostra risultati automaticamente
      mostraRisultati();
    }
    secondiRimasti--;
  }

  aggiorna();
  timerInterval = setInterval(aggiorna, 1000);
}

function fermaTimer() {
  if (timerInterval) {
    clearInterval(timerInterval);
    timerInterval = null;
  }
}

// Render domanda corrente
function renderDomanda() {
  const d = stato.domandeSelezionate[stato.current];
  const tot = stato.domandeSelezionate.length;
  const idx = stato.current;

  // Progresso
  const pct = Math.round((idx / tot) * 100);
  document.getElementById('progressText').textContent = `Domanda ${idx + 1} di ${tot}`;
  document.getElementById('progressPct').textContent = pct + '%';
  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('questionNum').textContent = `Domanda ${idx + 1}`;

  // Badge tipo
  const badge = document.getElementById('questionTypeBadge');
  if (d.tipo === 'vf') {
    badge.innerHTML = '<span class="question-type-badge badge-vf">Vero / Falso</span>';
  } else {
    badge.innerHTML = '<span class="question-type-badge badge-multi">Risposta multipla</span>';
  }

  // Testo
  document.getElementById('questionText').textContent = d.testo;

  // Opzioni (mescola le opzioni multipla, vf resta ordinate)
  const opzioni = d.tipo === 'vf' ? d.opzioni : shuffle(d.opzioni);
  const lettere = ['A','B','C','D'];
  const wrap = document.getElementById('optionsWrap');
  wrap.innerHTML = '';

  opzioni.forEach((op, i) => {
    const btn = document.createElement('button');
    btn.className = 'option-btn';
    btn.innerHTML = `<span class="option-letter">${d.tipo === 'vf' ? op[0] : lettere[i]}</span><span>${op}</span>`;
    btn.onclick = () => selezionaRisposta(op, d, btn, wrap);
    wrap.appendChild(btn);
  });

  // Reset feedback e bottone
  document.getElementById('feedbackMsg').className = 'feedback-msg';
  document.getElementById('feedbackMsg').textContent = '';
  const btnNext = document.getElementById('btnNext');
  btnNext.classList.remove('visible');
  btnNext.textContent = stato.current < stato.domandeSelezionate.length - 1 ? 'Prossima domanda →' : 'Vedi risultati →';
}

// Selezione risposta
function selezionaRisposta(risposta, domanda, btnCliccato, wrap) {
  const corretta = domanda.corretta;
  const esito = risposta === corretta;

  if (esito) stato.corrette++;

  stato.risposteDate.push({
    domanda: domanda.testo,
    tuaRisposta: risposta,
    rispostaCorretta: corretta,
    esito: esito
  });

  // Disabilita tutti i bottoni senza rivelare la risposta corretta
  wrap.querySelectorAll('.option-btn').forEach(b => {
    b.disabled = true;
  });

  // Evidenzia solo quella selezionata in neutro (grigio scuro)
  btnCliccato.classList.add('selected');

  document.getElementById('btnNext').classList.add('visible');
}

// Prossima domanda
window.nextQuestion = function() {
  stato.current++;
  if (stato.current >= stato.domandeSelezionate.length) {
    mostraRisultati();
  } else {
    renderDomanda();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }
};

// Mostra risultati
async function mostraRisultati() {
  fermaTimer();
  showScreen('screenRisultati');

  const tot = stato.domandeSelezionate.length;
  const corr = stato.corrette;
  const err = tot - corr;
  const pct = Math.round((corr / tot) * 100);
  const pass = pct >= 70;

  document.getElementById('resultIcon').textContent = pass ? '🏆' : '📚';
  document.getElementById('resultTitle').textContent = pass ? 'Ottimo lavoro!' : 'Continua a studiare!';
  document.getElementById('resultSub').textContent = `${stato.nome} ${stato.cognome} — ${stato.badgeText}`;
  document.getElementById('resultEsito').innerHTML = pass
    ? `<span class="esito-badge esito-pass">✓ Superato (${pct}%)</span>`
    : `<span class="esito-badge esito-fail">✗ Non superato (${pct}%)</span>`;

  document.getElementById('scoreCorrette').textContent = corr;
  document.getElementById('scoreTotale').textContent = `${corr}/${tot}`;
  document.getElementById('scoreErrate').textContent = err;

  // Riepilogo errori
  const errori = stato.risposteDate.filter(r => !r.esito);
  const reviewList = document.getElementById('reviewList');
  const reviewTitle = document.getElementById('reviewTitle');

  if (errori.length === 0) {
    reviewTitle.textContent = '🎉 Nessun errore!';
    reviewList.innerHTML = '<p style="font-size:14px;color:var(--text2)">Hai risposto correttamente a tutte le domande.</p>';
  } else {
    reviewTitle.textContent = `Domande errate (${errori.length})`;
    reviewList.innerHTML = errori.map(r => `
      <div class="review-item">
        <div class="review-question">${r.domanda}</div>
        <div class="review-answers">
          <div class="review-answer your-wrong">
            <div class="review-dot dot-red"></div>
            <span>La tua risposta: ${r.tuaRisposta}</span>
          </div>
          <div class="review-answer correct-ans">
            <div class="review-dot dot-green"></div>
            <span>Risposta corretta: ${r.rispostaCorretta}</span>
          </div>
        </div>
      </div>
    `).join('');
  }

  // Salva su Firebase
  document.getElementById('savingMsg').style.display = 'block';
  try {
    await addDoc(collection(db, 'risultati'), {
      nome: stato.nome,
      cognome: stato.cognome,
      corso: stato.corso,
      corsoLabel: stato.corsoLabel,
      categoria: stato.categoria || null,
      categoriaLabel: stato.categoriaLabel || null,
      numDomande: tot,
      corrette: corr,
      errate: err,
      percentuale: pct,
      superato: pass,
      timestamp: serverTimestamp(),
      // Salva le singole risposte per statistiche admin
      risposte: stato.risposteDate.map(r => ({
        domanda: r.domanda,
        tuaRisposta: r.tuaRisposta,
        rispostaCorretta: r.rispostaCorretta,
        corretta: r.esito
      }))
    });
    document.getElementById('savingMsg').textContent = '✓ Risultato salvato';
    document.getElementById('savingMsg').style.color = 'var(--green)';
  } catch(e) {
    document.getElementById('savingMsg').textContent = 'Risultato non salvato (errore connessione)';
  }

  window.scrollTo({ top: 0, behavior: 'smooth' });
}

// Storico personale
window.mostraStorico = async function() {
  showScreen('screenStorico');
  const nome = stato.nome;
  const cognome = stato.cognome;
  document.getElementById('storicoSub').textContent = `Ultimi 20 quiz di ${nome} ${cognome}`;
  const list = document.getElementById('storicoList');
  list.innerHTML = '<div style="color:var(--text2);font-size:13px;padding:10px 0">Caricamento...</div>';

  try {
    // Query senza orderBy per evitare errori indice Firebase
    const q = query(
      collection(db, 'risultati'),
      where('nome', '==', nome),
      where('cognome', '==', cognome)
    );
    const snap = await getDocs(q);

    if (snap.empty) {
      list.innerHTML = '<div style="color:var(--text2);font-size:13px;padding:10px 0">Nessun quiz trovato.</div>';
      return;
    }

    // Ordina lato client e prendi gli ultimi 20
    const docs = [];
    snap.forEach(doc => docs.push(doc.data()));
    docs.sort((a, b) => {
      const ta = a.timestamp ? a.timestamp.toDate() : new Date(0);
      const tb = b.timestamp ? b.timestamp.toDate() : new Date(0);
      return tb - ta;
    });
    const ultimi20 = docs.slice(0, 20);

    let html = '';
    ultimi20.forEach(r => {
      const data = r.timestamp ? r.timestamp.toDate() : new Date();
      const dataStr = data.toLocaleDateString('it-IT', { day:'2-digit', month:'2-digit', year:'numeric', hour:'2-digit', minute:'2-digit' });
      const categoria = r.categoriaLabel || r.corsoLabel || '';
      const pass = r.superato;
      const pct = r.percentuale || 0;
      html += `
        <div class="storico-item">
          <div class="storico-left">
            <div class="storico-corso">${categoria}</div>
            <div class="storico-data">📅 ${dataStr}</div>
          </div>
          <div class="storico-right">
            <div class="storico-pct ${pass ? 'pass' : 'fail'}">${pct}%</div>
            <div class="storico-domande">${r.corrette}/${r.numDomande} ${pass ? '✓' : '✗'}</div>
          </div>
        </div>`;
    });
    list.innerHTML = html;
  } catch(e) {
    list.innerHTML = `<div style="color:var(--red);font-size:13px">${e.message}</div>`;
  }
};
