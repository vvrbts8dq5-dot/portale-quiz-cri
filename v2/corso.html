<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Argomenti — Portale Formazione CRI Padova</title>
<link rel="preconnect" href="https://firestore.googleapis.com" crossorigin>
<link rel="preconnect" href="https://www.gstatic.com" crossorigin>
<link rel="preconnect" href="https://identitytoolkit.googleapis.com" crossorigin>
<link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js">
<link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js">
<link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="icon" href="img/icona-180.png">
<link rel="apple-touch-icon" href="img/icona-180.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#C8102E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Formazione CRI">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <a class="tondo" href="home.html" aria-label="Torna ai miei corsi" id="indietro"></a>
    <div><div class="t1" id="titoloBreve">Corso</div><div class="t2">Scegli l'argomento</div></div>
    <div class="spazio"></div>
    <img src="img/emblema-cri-padova.png" alt="Croce Rossa Italiana, Comitato di Padova">
  </div>

  <div class="saluto"><h1 id="titolo">Corso</h1></div>
  <div id="elenco"><div class="card"><p class="nota">Caricamento…</p></div></div>
</div>

<script type="module">
import { sfondoSimboli } from './js/sfondi.js';
sfondoSimboli();
import { richiediUtente, esc, messaggioErrore } from './js/auth.js';
import { leggiCorsi } from './js/domande.js';
import { ICONA, iconaCorso, iconaArgomento } from './js/icone.js';

const $ = id => document.getElementById(id);
$('indietro').innerHTML = ICONA.indietro;
const idCorso = new URLSearchParams(location.search).get('c');
const { profilo } = await richiediUtente();

try {
  if (!(profilo.corsi || []).includes(idCorso)) throw { code: 'non-iscritto' };
  const [corso] = await leggiCorsi([idCorso]);
  if (!corso) throw { code: 'non-iscritto' };
  document.title = `${corso.nome} — Portale Formazione CRI Padova`;
  $('titolo').textContent = corso.nome;
  $('titoloBreve').textContent = corso.nome;
  $('indietro').href = `area.html?a=${encodeURIComponent(corso.area || 'altro')}`;
  const tinta = iconaCorso(corso.id).tinta;
  const link = cat => `quiz.html?c=${encodeURIComponent(corso.id)}&cat=${encodeURIComponent(cat)}`;
  let h = corso.categorie.map(cat => `
    <a class="voce" href="${link(cat.id)}">
      <span class="icona ${tinta}">${iconaArgomento(cat.id)}</span>
      <span class="tit">${esc(cat.nome)}</span>
      <span class="freccia">${ICONA.avanti}</span></a>`).join('');
  if (corso.quizGenerale && corso.categorie.length > 1) {
    h += `<a class="voce" href="${link('generale')}" style="margin-top:20px">
      <span class="icona scuro">${iconaArgomento('generale')}</span>
      <span><span class="tit" style="display:block">Quiz generale</span><span class="sub">Domande da tutti gli argomenti</span></span>
      <span class="freccia">${ICONA.avanti}</span></a>`;
  }
  h += `<a class="voce" href="giochi.html?c=${encodeURIComponent(corso.id)}" style="margin-top:${corso.quizGenerale && corso.categorie.length > 1 ? 12 : 20}px">
      <span class="icona" style="background:linear-gradient(135deg,#FDE7EA,#FFEEDB)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="7" width="20" height="11" rx="5.5"/><path d="M7 10.5v4M5 12.5h4"/><circle cx="15.5" cy="11.5" r="1"/><circle cx="18" cy="14" r="1"/></svg></span>
      <span><span class="tit" style="display:block">Giochi</span><span class="sub">Allenati giocando: sequenze, casi clinici, sfide a tempo</span></span>
      <span class="freccia">${ICONA.avanti}</span></a>`;
  $('elenco').innerHTML = h;
} catch (e) {
  $('elenco').innerHTML = e.code === 'non-iscritto'
    ? '<div class="card"><div class="msg err">Non sei iscritto a questo corso. <a href="home.html">Torna ai tuoi corsi</a>.</div></div>'
    : `<div class="card"><div class="msg err">${esc(messaggioErrore(e))}</div></div>`;
}
</script>
</body>
</html>
