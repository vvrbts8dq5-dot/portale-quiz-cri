<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>I miei corsi — Portale Formazione CRI Padova</title>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="icon" href="img/icona-180.png">
<link rel="apple-touch-icon" href="img/icona-180.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#C8102E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Formazione CRI">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="wrap">

  <div class="topbar">
    <img src="img/emblema-cri-padova.png" alt="Croce Rossa Italiana, Comitato di Padova">
    <div><div class="t1">CRI Padova</div><div class="t2">Formazione</div></div>
    <div class="spazio"></div>
    <a class="avatar" id="avatar" href="profilo.html" aria-label="Il mio profilo"></a>
  </div>

  <div class="saluto">
    <h1 id="saluto">Ciao</h1>
    <p id="sottoSaluto">Su cosa ti alleni oggi?</p>
  </div>

  <div class="card hidden" id="avvisoPrivacy" style="padding:18px 20px">
    <p class="nota" style="margin-bottom:12px">Abbiamo pubblicato l'<a href="privacy.html">informativa sul trattamento dei dati</a> del portale: leggila quando puoi.</p>
    <button class="btn piccolo" id="btnPrivacyOk" type="button">Ho letto</button>
  </div>

  <div id="elencoCorsi"><div class="card"><p class="nota">Caricamento…</p></div></div>

  <nav class="navbar" id="navbar" aria-label="Navigazione"></nav>

  <div class="footer">Portale riservato ai volontari CRI</div>
</div>

<script type="module">
import { richiediUtente, esc, messaggioErrore, eStaff } from './js/auth.js';
import { leggiCorsi } from './js/domande.js';
import { ICONA, iniziali } from './js/icone.js';
import { perArea, vociCorsi, riquadriAree } from './js/aree.js';
import { sfondoAttrezzature } from './js/sfondi.js';
import { db } from './js/firebase.js';
import { doc, updateDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

sfondoAttrezzature();
const $ = id => document.getElementById(id);

const { profilo } = await richiediUtente();
$('saluto').textContent = `Ciao ${profilo.nome}`;
$('avatar').textContent = iniziali(profilo);

$('navbar').innerHTML = `
  <a class="attiva" href="home.html">${ICONA.casa}Corsi</a>
  <a href="storico.html">${ICONA.grafico}I miei quiz</a>
  ${eStaff(profilo) ? `<a href="admin/index.html">${ICONA.ingranaggio}Pannello</a>` : `<a href="profilo.html">${ICONA.utente}Profilo</a>`}`;

if (!profilo.privacyIl) {
  $('avvisoPrivacy').classList.remove('hidden');
  $('btnPrivacyOk').onclick = async () => {
    try { await updateDoc(doc(db, 'utenti', profilo.uid), { privacyIl: serverTimestamp() }); $('avvisoPrivacy').classList.add('hidden'); }
    catch (e) { alert(messaggioErrore(e)); }
  };
}

try {
  const corsi = await leggiCorsi(profilo.corsi);
  const gruppi = perArea(corsi);
  if (!corsi.length) {
    $('elencoCorsi').innerHTML = '<div class="card"><p class="nota">Non hai ancora corsi assegnati. Rivolgiti all\'istruttore.</p></div>';
  } else {
    $('sottoSaluto').textContent = 'Scegli un\'area per iniziare';
    $('elencoCorsi').innerHTML = riquadriAree(gruppi);
  }
} catch (e) {
  $('elencoCorsi').innerHTML = `<div class="card"><div class="msg err">${esc(messaggioErrore(e))}</div></div>`;
}
</script>
</body>
</html>
